services:
  postgres:
    image: postgres:16
    container_name: evenuc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - evenuc_pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./insert.sql:/docker-entrypoint-initdb.d/02-insert.sql:ro

volumes:
  evenuc_pgdata: